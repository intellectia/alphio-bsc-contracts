# Alphio contracts — deployed on BNB Smart Chain (BSC).
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 1_000_000
evm_version = "paris"

remappings = ["forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
# BNB Smart Chain mainnet (chainId 56)
bsc = "https://bsc-dataseed.bnbchain.org"
# BNB Smart Chain testnet (chainId 97)
bsc_testnet = "https://bsc-testnet-dataseed.bnbchain.org"
